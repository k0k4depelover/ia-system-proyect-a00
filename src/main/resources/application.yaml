spring:
  application:
    name: notas
    


  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:6432/app?sslmode=disable&prepareThreshold=0&preparedStatementCacheQueries=0}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000   # ms
      
  flyway:
    url: ${FLYWAY_URL:jdbc:postgresql://localhost:5433/app}
    user: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
    mvc:
      problemdetails:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: validate  # Si es la primera vez ejecutando cambiar a: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  mvc:
    problemdetails:
      enabled: true


server:
  web:
    error:
      include-error: always
      include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
        